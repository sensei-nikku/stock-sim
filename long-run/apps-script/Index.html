<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #0a0f1a; color: #e6edf7;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .lr-boot { max-width: 520px; margin: 80px auto; padding: 24px; text-align: center; color: #8896b3; line-height: 1.5; }
    .lr-boot b { color: #e6edf7; }
    .lr-bootfail { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #fca5a5;
                   border-radius: 10px; padding: 16px 18px; text-align: left; }
  </style>
</head>
<body>
  <div id="app"><div class="lr-boot">Loading <b>The Long Run</b>&hellip;</div></div>

  <!-- Built on the server: the student's saved game, and the release a teacher approved. -->
  <script>window.LONGRUN_BOOT = <?!= BOOT ?>;</script>
  <script>window.LONGRUN_RELEASE = <?!= longRunRelease() ?>;</script>

  <script>
  /* The Long Run — Apps Script shell (Index.html), v3: pinned releases only.
   *
   * Everyone — students and teachers — runs only the release pinned in Release.gs:
   *   - files come from long-run/releases/<id>/ on GitHub Pages, or jsDelivr at the
   *     exact commit as a backup;
   *   - each file carries its SHA-384 hash, and the browser refuses to run a file whose
   *     bytes don't match (Subresource Integrity). Fonts are inside styles.css, so its
   *     hash covers them; nothing else is fetched.
   * A push to GitHub changes nothing. A new pin reaches /dev when Release.gs is pasted,
   * and students only when a new deployment version is made. There is no unpinned path.
   */
  (function () {
    var PAGES = 'https://sensei-nikku.github.io/stock-sim/long-run/';
    var CDN   = 'https://cdn.jsdelivr.net/gh/sensei-nikku/stock-sim@';
    var SCRIPTS = ['data.js', 'persistence.js', 'game.js'];   // order matters
    var REL = window.LONGRUN_RELEASE;

    function fail(msg) {
      document.getElementById('app').innerHTML =
        '<div class="lr-boot"><div class="lr-bootfail"><b>The game couldn\'t load.</b><br>' + msg + '</div></div>';
    }
    var DOWN = 'Refresh the page and try again. If it still won\'t load, the game is down for now &mdash; ' +
               'let your teacher know and work on something else.';

    function el(tag, url, hash) {
      var e = document.createElement(tag);
      if (tag === 'link') { e.rel = 'stylesheet'; e.href = url; } else { e.src = url; }
      if (hash) { e.integrity = hash; e.crossOrigin = 'anonymous'; }
      return e;
    }
    // Load css then scripts in order from one source; any failure (404, network, hash
    // mismatch) -> onFail. Hash-checked CSS must pass too: a bad stylesheet can phish.
    function loadFrom(urlFor, hashFor, onOk, onFail) {
      var css = el('link', urlFor('styles.css'), hashFor('styles.css')), done = false;
      css.onload = function () { if (!done) { done = true; next(0); } };
      css.onerror = function () { if (!done) { done = true; css.remove(); onFail(); } };
      setTimeout(function () { if (!done) { done = true; next(0); } }, 6000);   // slow CSS: go on unstyled (it stays hash-checked)
      document.head.appendChild(css);
      function next(i) {
        if (i >= SCRIPTS.length) { onOk(); return; }
        var s = el('script', urlFor(SCRIPTS[i]), hashFor(SCRIPTS[i]));
        s.onload = function () { next(i + 1); };
        s.onerror = function () { s.remove(); onFail(); };
        document.body.appendChild(s);
      }
    }

    function startRelease() {
      if (!REL || !REL.files) {
        fail('This game hasn\'t been released yet. (Teacher: Release.gs is missing or its pin is damaged.)');
        return;
      }
      var hash = function (f) { return REL.files[f]; };
      var roots = [PAGES + 'releases/' + REL.id + '/', CDN + REL.sha + '/long-run/releases/' + REL.id + '/'];
      var i = 0;
      (function tryNext() {
        if (i >= roots.length) { fail(DOWN); return; }
        var root = roots[i++];
        loadFrom(function (f) { return root + f; }, hash, function () {}, tryNext);
      })();
    }


    startRelease();
  })();
  </script>
</body>
</html>
